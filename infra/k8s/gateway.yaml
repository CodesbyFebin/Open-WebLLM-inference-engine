apiVersion: apps/v1
kind: Deployment
metadata: {name: inference-gateway}
spec:
  replicas: 1
  selector:
    matchLabels: {app: inference-gateway}
  template:
    metadata:
      labels: {app: inference-gateway}
    spec:
      containers:
        - name: gateway
          image: REPLACE_WITH_YOUR_PRIVATE_REGISTRY/gateway:0.1.0
          ports: [{containerPort: 8080}]
          env:
            - name: API_KEY
              valueFrom: {secretKeyRef: {name: inference-credentials, key: api-key}}
            - name: VLLM_URL
              value: http://vllm:8000
          readinessProbe:
            httpGet: {path: /health, port: 8080}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata: {name: inference-gateway}
spec:
  type: ClusterIP
  selector: {app: inference-gateway}
  ports: [{port: 8080, targetPort: 8080}]
