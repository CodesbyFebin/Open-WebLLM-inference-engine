# Self-host on infrastructure you already control. No GPU or hosted model starts.
name: open-web-llm
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set a unique random administrator password}
      POSTGRES_DB: inference
      HELLO_MIGRATOR_PASSWORD: ${HELLO_MIGRATOR_PASSWORD:?set a unique migration password}
      HELLO_APP_PASSWORD: ${HELLO_APP_PASSWORD:?set a unique application password}
      HELLO_WORKER_PASSWORD: ${HELLO_WORKER_PASSWORD:?set a unique worker password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d inference']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  migrate:
    build: ./api
    command: ['python', '-m', 'app.migrate']
    restart: 'no'
    environment:
      MIGRATION_DATABASE_URL: postgresql://hello_migrator:${HELLO_MIGRATOR_PASSWORD:?required}@postgres:5432/inference
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=16m']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [internal]

  gateway:
    build: ./api
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://hello_app:${HELLO_APP_PASSWORD:?required}@postgres:5432/inference
      AUTH_THROTTLE_PEPPER: ${AUTH_THROTTLE_PEPPER:?set an independent random pepper}
      VLLM_URL: ${INFERENCE_URL:-http://unconfigured.invalid}
      VLLM_MODEL: ${INFERENCE_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      NIM_ENABLED: 'false'
      ALLOW_MACHINE_API_KEY: 'false'
      BENCHMARK_DB: /data/inference-benchmarks.sqlite3
    volumes:
      - benchmarks:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=32m']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 128
    mem_limit: 1g
    networks: [internal]

  worker:
    profiles: ['workers']
    build: ./api
    command: ['python', '-m', 'app.worker']
    restart: unless-stopped
    environment:
      WORKER_DATABASE_URL: postgresql://hello_worker:${HELLO_WORKER_PASSWORD:?required}@postgres:5432/inference
      VLLM_URL: ${INFERENCE_URL:-http://unconfigured.invalid}
      VLLM_MODEL: ${INFERENCE_MODEL:-Qwen/Qwen2.5-7B-Instruct}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=16m']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 64
    mem_limit: 1g
    networks: [internal]

  https:
    build:
      context: .
      dockerfile: infra/deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set an existing domain pointed to this host}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [gateway]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,nodev,size=16m']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    networks: [internal]
networks:
  internal:
volumes:
  postgres-data:
  benchmarks:
  caddy-data:
  caddy-config:
